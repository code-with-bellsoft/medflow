services:
  postgres:
    image: postgres:16-alpine
    container_name: medflow-postgres
    environment:
      POSTGRES_DB: medflow
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: medpass
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meduser -d medflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - medflow_pgdata:/var/lib/postgresql/data

volumes:
  medflow_pgdata: